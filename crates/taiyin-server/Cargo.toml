[package]
name = "taiyin-server"
version = "0.1.0"
edition = "2024"

[dependencies]
taiyin-core = { path = "../taiyin-core" }

anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
