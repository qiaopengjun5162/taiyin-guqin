name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build WASM
        run: |
          cd crates/taiyin-core
          wasm-pack build --target web
          cd ../..
          rm -rf apps/web/wasm apps/web/public/wasm
          cp -r crates/taiyin-core/pkg apps/web/wasm
          cp -r crates/taiyin-core/pkg apps/web/public/wasm

      - name: Build frontend
        # 后端地址在**构建期**注入，而不是让每个访客自己去设置面板里填。
        #
        # 前端读 `process.env.NEXT_PUBLIC_API_URL`（见 lib/api.ts 的 getApiBase），
        # NEXT_PUBLIC_ 前缀会被 Next 内联进客户端 bundle。留空时它是空串，
        # `getApiBase()` 走 `|| null` → 退回「纯前端模式」（曲谱只存本机、识别走浏览器
        # 内模板匹配），所以变量没设也不会把站点搞坏。
        #
        # ⚠️ 当前 `TAIYIN_API_URL` 仓库变量指向的后端（taiyin.qintopia.cn）暂未运行，
        # 故这里**不注入**该地址 → 线上站自动进入 browser-only，减字识别/播放/导出全在
        # 浏览器跑、零后端、零成本。等后端就绪，在 Settings → Variables 设回地址、重跑
        # 本工作流即可切回「连后端」模式。
        #
        # BASE_PATH 显式给子路径，兼容 GitHub Pages 项目页；Vercel/Netlify 部署时
        # 把 BASE_PATH 设为空串（见仓库根 vercel.json / netlify.toml）。
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.TAIYIN_API_URL }}
          BASE_PATH: /taiyin-guqin
        run: pnpm --filter web build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
