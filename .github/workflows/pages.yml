name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build WASM
        run: |
          cd crates/taiyin-core
          wasm-pack build --target web
          cd ../..
          rm -rf apps/web/wasm apps/web/public/wasm
          cp -r crates/taiyin-core/pkg apps/web/wasm
          cp -r crates/taiyin-core/pkg apps/web/public/wasm

      - name: Build frontend
        # 后端地址在**构建期**注入，而不是让每个访客自己去设置面板里填。
        #
        # 前端读 `process.env.NEXT_PUBLIC_API_URL`（见 lib/api.ts 的 getApiBase），
        # NEXT_PUBLIC_ 前缀会被 Next 内联进客户端 bundle。留空时它是空串，
        # `getApiBase()` 走 `|| null` → 退回「纯前端模式」（曲谱只存本机），
        # 所以变量没设也不会把站点搞坏。
        #
        # 用仓库变量而不是写死：换域名时只改 Settings → Variables，重跑本工作流即可，
        # 不用改代码、不用重新 review 一个只改了字符串的提交。
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.TAIYIN_API_URL }}
        run: pnpm --filter web build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
