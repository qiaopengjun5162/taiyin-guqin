name: Deploy Smoke

# 为什么要有这条：`deploy/docker-compose.yml` 是上线时照着敲的东西，它最容易错的
# 不是代码，而是变量没接上、探针顺序不对、端口撞了、库还没 ready 后端就去跑迁移——
# 这些用 `docker compose config` 一个都看不出来，只有真起一遍才暴露。
#
# 它跑的就是「3A 拉成品镜像」那条路，等于把上线当天要敲的命令提前跑一遍。
#
# 验收本身不写在这里，而是调 `scripts/verify-deployed.sh`——同一条命令既能对
# 127.0.0.1 跑，也能对 https://taiyin.你的域名 跑。脚本能被 CI 每天跑，才不会烂。

on:
  workflow_dispatch:
  push:
    paths:
      - deploy/**
      - scripts/verify-deployed.sh
      - .github/workflows/deploy-smoke.yml

permissions:
  contents: read
  packages: read

jobs:
  compose:
    name: 用 deploy/ 编排起一遍
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 起编排（手册 3A 的三条命令）
        working-directory: deploy
        run: |
          set -euo pipefail
          cp .env.example .env
          # 只改这三行：口令、白名单、管理口令。其余保持示例值，正好验证示例本身可用。
          sed -i \
            -e 's#^PG_PASSWORD=.*#PG_PASSWORD=smoke_pw_9f3a#' \
            -e 's#^ALLOWED_ORIGINS=.*#ALLOWED_ORIGINS=https://qiaopengjun5162.github.io#' \
            -e 's#^ADMIN_TOKEN=.*#ADMIN_TOKEN=smoke_admin_9f3a#' \
            .env
          docker compose up -d
          docker compose ps

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:13001/health >/dev/null 2>&1; then
              echo "✅ 编排起得来，/health 200（第 $i 次探测；迁移在启动时自动跑完）"
              exit 0
            fi
            sleep 2
          done

          echo "❌ 后端一直没起来，日志如下"
          docker compose logs --tail 60 server || true
          docker compose logs --tail 30 pg || true
          exit 1

      - name: 验收（同一条脚本，线上也是它）
        run: |
          FRONTEND_ORIGIN=https://qiaopengjun5162.github.io \
            bash scripts/verify-deployed.sh http://127.0.0.1:13001

      - name: 收尾（无论如何都清掉，避免残留容器占着 runner）
        if: always()
        working-directory: deploy
        run: docker compose down -v || true
