name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taiyin
          POSTGRES_PASSWORD: taiyin_dev
          POSTGRES_DB: taiyin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taiyin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 供后端集成测试(tests/scores.rs, tests/translate.rs)连接;
      # common/mod.rs 会据此自动执行 migrations。
      DATABASE_URL: postgres://taiyin:taiyin_dev@localhost:5432/taiyin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Verify Rust-to-TS wire types are in sync
        # 重新从 Rust wire 类型生成前端 TS（src/bin/gen_types.rs），
        # 再比对 git 工作树中的 apps/web/src/lib/generated。
        # 若有人改了 Rust 契约却忘了 just gen-types，这里会失败，防止契约漂移。
        run: cargo run -p taiyin-core --bin gen_types && git diff --exit-code -- apps/web/src/lib/generated
      - name: Test
        run: cargo nextest run --all-features

  coverage:
    # 非阻塞：覆盖率仅作可视化与基线追踪，任何步骤失败都不应让整体 CI 变红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
        continue-on-error: true
      - name: Install nextest
        uses: taiki-e/install-action@nextest
        continue-on-error: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
        continue-on-error: true
      - name: Generate coverage (lcov)
        # 仅 --lib（不依赖数据库）；软目标 taiyin-core 行覆盖 ≥ 90%（2026-08-02 实测 96.8%）。
        run: cargo llvm-cov nextest --lib --lcov --output-path lcov.info
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm --filter web lint
      - name: Type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Test
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
