name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taiyin
          POSTGRES_PASSWORD: taiyin_dev
          POSTGRES_DB: taiyin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taiyin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 供后端集成测试(tests/scores.rs, tests/translate.rs)连接;
      # common/mod.rs 会据此自动执行 migrations。
      DATABASE_URL: postgres://taiyin:taiyin_dev@localhost:5432/taiyin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Verify Rust-to-TS wire types are in sync
        # 重新从 Rust wire 类型生成前端 TS（src/bin/gen_types.rs），
        # 再比对 git 工作树中的 apps/web/src/lib/generated。
        # 若有人改了 Rust 契约却忘了 just gen-types，这里会失败，防止契约漂移。
        run: cargo run -p taiyin-core --bin gen_types && git diff --exit-code -- apps/web/src/lib/generated
      - name: Dependency vulnerability audit (cargo audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 与 .cargo/audit.toml 的豁免保持一致：rsa 0.9.x 的 Marvin 计时侧信道、webpki-roots 0.26.x
          # 的 bundled-root 信任问题均暂无上游修复版本（前者无补丁，后者修复在 1.0.x 需 rustls 主版本联动）。
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0381
      - name: Test
        run: cargo nextest run --all-features

  coverage:
    # 覆盖率闸门：低于阈值直接让 CI 变红，防止「加了代码没加测试」悄悄腐烂。
    # 阈值 = 2026-10-29 实测 --lib 基线（行 74.7%）略降，只用于防退步，不追求刷高。
    # 口径说明：--lib 不含 tests/ 下的集成测试，故 routes.rs 在此口径下为 0%；
    # 集成测试由 rust job 的 nextest 守着，别用这里的数字误判整体质量。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: "Generate coverage (gate: lines >= 70%)"
        run: cargo llvm-cov nextest --lib --fail-under-lines 70 --lcov --output-path lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM
        # 前端直接 import('@/wasm/taiyin_core')（经 tsconfig 的 '@/wasm/*': ['./wasm/*']
        # 解析到 apps/web/wasm），而 apps/web/wasm 被本地 .gitignore(*) 忽略、不进仓库，
        # CI 必须先编译 wasm 并拷贝 pkg 到 apps/web/wasm 与 apps/web/public/wasm，
        # 否则后续 Type check / Build 会因找不到模块而失败。
        # 步骤与一直绿的 pages.yml 保持一致。
        run: |
          cd crates/taiyin-core
          wasm-pack build --target web
          cd ../..
          rm -rf apps/web/wasm apps/web/public/wasm
          cp -r crates/taiyin-core/pkg apps/web/wasm
          cp -r crates/taiyin-core/pkg apps/web/public/wasm
      - name: Verify WASM contract
        # 真实 WASM 产物契约验证（非 mock）：断言翻译返回、枚举序列化与前端映射兼容、
        # tuning 参数确实改变候选。前置条件由上一 Build WASM 步骤满足（apps/web/wasm 已生成）。
        # 见 scripts/verify-wasm.mjs 与 just verify-wasm。
        run: node scripts/verify-wasm.mjs
      - name: Lint
        run: pnpm --filter web lint
      - name: Type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Test
        run: pnpm --filter web exec vitest run --coverage
      - name: Build
        run: pnpm --filter web build
