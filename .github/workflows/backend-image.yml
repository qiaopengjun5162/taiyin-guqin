name: Backend Image

# 为什么要有这条：部署用的那台机器只有 1 核，还在跑业务。
# 在它上面 `docker build` 编 Rust 会吃满 CPU 十几分钟，同机的服务会被拖慢甚至超时。
# 所以镜像在 CI 上编，服务器只做 `docker pull`——它不需要编译器，也不需要 1G 以上的内存峰值。

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - crates/taiyin-core/**
      - crates/taiyin-server/**
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并推送 ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr（用仓库自带 token，不需要额外密钥）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 两个标签各有用处：
          # - latest：服务器日常 `docker pull` 用，指向最新一次成功构建
          # - sha-xxxx：回滚用。服务器上出问题时，把 compose 里的标签改回上一个 sha 即可，
          #   不用重新编译，也不用慌。
          images: ghcr.io/${{ github.repository_owner }}/taiyin-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Rust 全量编译十几分钟，缓存命中能把后续构建压到 1~2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max
