name: Backend Image

# 为什么要有这条：部署用的那台机器只有 1 核，还在跑业务。
# 在它上面 `docker build` 编 Rust 会吃满 CPU 十几分钟，同机的服务会被拖慢甚至超时。
# 所以镜像在 CI 上编，服务器只做 `docker pull`——它不需要编译器，也不需要 1G 以上的内存峰值。

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - crates/taiyin-core/**
      - crates/taiyin-server/**
      - .github/workflows/backend-image.yml
      # smoke job 跑的就是这两份脚本，且它是**唯一**验「匿名拉成品」路径的地方
      # （runbook-smoke 跑同脚本但走本地 build 分支，验不到 SMOKE_IMG 那条路）。
      # 历史实证：6287884 给脚本加了收藏链路，只改脚本+文档，本 workflow 没触发。
      # 补上 paths 后，改成品闸门脚本一定会连着把成品再拉一遍验掉。
      # 低频（脚本不常改）+ buildx 的 gha 缓存命中，重建成本可接受。
      - scripts/smoke-backend.sh
      - scripts/smoke-domain-http.mjs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并推送 ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr（用仓库自带 token，不需要额外密钥）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 两个标签各有用处：
          # - latest：服务器日常 `docker pull` 用，指向最新一次成功构建
          # - sha-xxxx：回滚用。服务器上出问题时，把 compose 里的标签改回上一个 sha 即可，
          #   不用重新编译，也不用慌。
          images: ghcr.io/${{ github.repository_owner }}/taiyin-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Rust 全量编译十几分钟，缓存命中能把后续构建压到 1~2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    # 为什么「推送成功」之后还要再拉一遍：这一步验的**不是代码，是产物**。
    #
    # 在它之前，全仓库没有任何一处跑过 ghcr 上的东西——
    #   - 本 job 的 build 只做 build + push；
    #   - runbook-smoke 的 smoke-backend.sh 是**本地 build**；
    #   - deploy-smoke 为了避开「latest 还是上一个提交」的竞态，也故意本地 build。
    # 于是服务器 `docker pull` 拿到的镜像是什么质量，CI 从来不知道：
    # 缺静态库、CMD 写错、迁移没打进镜像、架构标错——这些都能让 push 成功而运行即死。
    # 「build 绿 ≠ 产物可用」，和本项目其它几处「绿了但没真跑」是同一类事故。
    #
    # 用 **sha 标签**而不是 latest：并发推送时 latest 可能已经指向别人的提交，
    # 用它验等于验了个不知道是谁的镜像。
    name: 拉回成品镜像照手册跑一遍
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 刻意**不**登录 ghcr。
      #
      # 服务器是匿名拉的（手册 3A：「镜像已公开、匿名可拉」）。这条 job 一旦登录，
      # `GITHUB_TOKEN` 自带包读权限，**包被误设成私有也照样拉得下来**——手册里记着
      # 这个坑踩过一次：CI 一直绿，服务器 denied。闸门的凭据必须和真用户的凭据一致，
      # 否则它验的就不是同一条路。
      - name: 拼出本次推送的 sha 标签
        id: ref
        # 与上面 docker/metadata-action 的 `type=sha,format=short` 同一口径（7 位）
        run: echo "image=ghcr.io/${{ github.repository_owner }}/taiyin-server:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 照手册全链路验证（匿名拉成品，不重新构建）
        env:
          SMOKE_IMG: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          # 刚 push 完立刻 pull 偶尔会撞上注册表的最终一致性（明明推成功了却是 404），
          # 那是登记延迟不是镜像坏。重试三次把这种情况和真失败分开。
          #
          # 这里的 pull 同时兼作「包可见性」检查：匿名拉不到就是服务器也拉不到。
          for i in 1 2 3; do
            if docker pull "$SMOKE_IMG"; then break; fi
            echo "第 $i 次 pull 失败，等 10 秒重试"
            sleep 10
            [[ $i -lt 3 ]] || {
              echo "❌ 三次都拉不到 $SMOKE_IMG"
              echo "   若报 denied/unauthorized：去 Packages → taiyin-server → Package settings 把可见性改回 Public"
              exit 1
            }
          done
          bash scripts/smoke-backend.sh

