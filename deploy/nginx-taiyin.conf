# 太音后端 · Nginx 站点配置
#
# 放到 /etc/nginx/sites-available/taiyin.conf 再软链到 sites-enabled，
# 证书用 certbot 签（签之前先用 HTTP 版的 location，签完 certbot 会自动补 listen 443）。
#
# 三条容易漏的：
#   1. client_max_body_size —— 整页减字谱长图可能好几 MB，默认 1m 会直接 413；
#   2. proxy_read_timeout —— AI 识别一张整页图可能几十秒，默认 60s 会断；
#   3. proxy_set_header X-Forwarded-* —— 不传的话后端日志里全是反代地址，排障全靠猜。

server {
    listen 80;
    listen [::]:80;
    server_name taiyin.qintopia.cn;

    # certbot 续期用的路径，别挡
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taiyin.qintopia.cn;

    ssl_certificate     /etc/letsencrypt/live/taiyin.qintopia.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taiyin.qintopia.cn/privkey.pem;

    # 上传整页谱图
    client_max_body_size 20m;

    # 只转发到本机后端容器，不暴露 3001
    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 识别可能跑几十秒
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
