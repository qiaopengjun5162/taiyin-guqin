# ────────────────────────────────────────────
# 太音 · Docker 开发环境
# ────────────────────────────────────────────

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taiyin
      POSTGRES_USER: taiyin
      POSTGRES_PASSWORD: taiyin_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
