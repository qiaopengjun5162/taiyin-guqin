# cargo audit 配置（cargo-audit 会自动读取 .cargo/audit.toml）。
#
# 仅豁免「上游暂无修复版本」的 advisory；凡有可用修复版本的漏洞，
# 都应在 Cargo.lock 中通过 `cargo update -p <crate>` 升级解决，而非在此豁免。
#
# RUSTSEC-2023-0071 — rsa 0.9.x 的 Marvin 计时侧信道攻击（severity 5.9 / medium）。
#   RustSec 官方明确 "No fixed upgrade is available!"，无法靠升级 rsa 修复。
#   缓解依据：本项目仅在 JWT 验签路径使用 rsa（经由 jsonwebtoken），且为自托管部署，
#   攻击者的计时侧信道测量窗口极窄，现实风险可控。
#   一旦上游 rsa / jsonwebtoken 发布补丁，应立即移除该豁免并升级依赖。

# RUSTSEC-2026-0381 — webpki-roots 0.26.x 打包的根证书信任了已被 distrusted 的 emSign 中间证书。
#   修复仅存在于 webpki-roots 1.0.x；当前依赖方 rustls 0.23 锁定的是 0.26.x，升级到 1.0 需要
#   rustls 主版本联动（破坏性变更），暂不宜强制。本项目仅向 api.anthropic.com 发起 HTTPS 调用、
#   使用已知 CA，该 bundled-root 信任问题的现实风险极低。待 rustls 链支持 webpki-roots 1.0 后
#   移除该豁免并升级依赖。

# RUSTSEC-2026-0459 — libsqlite3-sys 0.30.1 打包的 SQLite < 3.54.0 在处理
#   页大小不一致的 -wal 兄弟文件时会返回未初始化页缓存内存（CVE-2026-119375）。
#   修复要求 libsqlite3-sys >= 0.39.0（rusqlite 0.41），但 **上游整条链都没跟上**：
#   sqlx 0.8.6 锁 ^0.30.1，sqlx 0.9.0 也只到 ^0.37.0，sqlx-sqlite 0.9 要求
#   `>=0.30.1, <0.38.0` —— 升级 sqlx 到当前最新稳定版也消除不了这条 advisory。
#   影响面为零的两条依据：
#     1. 该 crate 只在 sqlx 的 `sqlite` feature 下参与编译，本项目只用 `postgres`
#        （`cargo tree -p sqlx -f "{p} {f}"` 的 feature 列表里没有 sqlite，
#        `cargo tree -i libsqlite3-sys` 也返回 nothing）——它只存在于 Cargo.lock。
#     2. 漏洞触发需要「本地打开一个攻击者可写的 db 文件 + 同目录 -wal」，
#        本项目不打开任何 SQLite 文件，只连云上的 Postgres。
#   待 sqlx 链放开到 libsqlite3-sys >= 0.39 后，移除该豁免并升级依赖。

[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0459",
]
